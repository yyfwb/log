<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a6dff">
<meta name="format-detection" content="telephone=no">
<title>转播技术组日志</title>
<script src="https://cdn.jsdelivr.net/npm/cos-js-sdk-v5/dist/cos-js-sdk-v5.min.js"></script>
<style>
:root{
  --bg:#f2f4f8; --card:#ffffff; --line:#e5e9f1; --line2:#eef1f7;
  --txt:#16202f; --txt2:#5b6980; --txt3:#8e9ab0;
  --blue:#1a6dff; --blue-d:#0b4fc4; --blue-bg:#eaf1ff;
  --orange:#e07b16; --orange-bg:#fff4e6;
  --green:#0f9152; --green-bg:#e7f8ef;
  --purple:#7c4ded; --purple-bg:#f2ecff;
  --red:#e04a41;
  --r:14px; --tabbar:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + 8px);
}
h1,h2,h3{margin:0;font-weight:600;}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;font-size:15px;}
svg{display:block;}

/* ============ 顶栏 ============ */
.appbar{
  position:sticky; top:0; z-index:30;
  background:#fff; border-bottom:1px solid var(--line);
  padding:8px 14px calc(8px + env(safe-area-inset-top)) 14px;
  padding-top:calc(8px + env(safe-area-inset-top));
}
.appbar-in{display:flex;align-items:center;gap:9px;max-width:760px;margin:0 auto;}
.applogo{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,#1a6dff,#3f8dff);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;
}
.appbar-t{display:flex;align-items:baseline;gap:7px;min-width:0;flex:1;}
.apptitle{font-size:15px;font-weight:600;letter-spacing:.2px;white-space:nowrap;flex:none;}
.appdate{font-size:11.5px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.appbar .chip{
  margin-left:auto;flex:none;font-size:11.5px;color:var(--blue-d);background:var(--blue-bg);
  padding:3px 9px;border-radius:20px;white-space:nowrap;
}

/* ============ 页面 ============ */
main{max-width:760px;margin:0 auto;padding:10px 16px 8px;}
.page{display:none;}
.page.active{display:block;animation:in .22s ease;}
@keyframes in{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}

.page-head{display:flex;align-items:baseline;gap:9px;margin:2px 2px 9px;}
.page-head h2{font-size:16px;}
.page-head .sub{font-size:12.5px;color:var(--txt3);}
.count{margin-left:auto;font-size:12px;color:var(--txt2);background:#fff;
  border:1px solid var(--line);padding:3px 10px;border-radius:20px;white-space:nowrap;}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(22,32,47,.03);}

/* ============ 表单 ============ */
.field{margin-bottom:16px;}
.field:last-child{margin-bottom:0;}
.lb{display:block;font-size:13.5px;font-weight:600;color:var(--txt2);margin-bottom:7px;}
.lb em{color:var(--red);font-style:normal;font-weight:400;margin-left:2px;}
.lb .opt{font-size:12px;font-weight:400;color:var(--txt3);margin-left:5px;}

input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;border:1px solid var(--line);border-radius:11px;background:#fbfcfe;
  font-size:16px;padding:12px 13px;min-height:50px;outline:none;
  transition:border-color .15s,box-shadow .15s,background .15s;
  appearance:none;-webkit-appearance:none;
}
select{
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238e9ab0' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;background-size:18px;padding-right:38px;
}
textarea{resize:vertical;min-height:104px;line-height:1.65;padding-top:12px;font-size:16px;}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(26,109,255,.11);}
select:disabled{color:var(--txt3);background-color:#f5f7fa;}

.taskinfo{
  margin-top:8px;font-size:12.5px;color:var(--txt2);background:#f5f8fd;
  border:1px solid var(--line2);border-radius:10px;padding:9px 11px;line-height:1.6;
}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:20px;background:#eef1f7;color:var(--txt2);}
.pill.doing{background:var(--blue-bg);color:var(--blue-d);}
.pill.done{background:var(--green-bg);color:var(--green);}
.pill.todo{background:#f0f2f7;color:var(--txt3);}

/* ============ 照片 ============ */
.pbtns{display:flex;gap:10px;}
.pbtn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  min-height:50px;border-radius:11px;border:1px dashed #c3d2e8;background:#fafcff;
  color:var(--blue-d);font-size:14px;font-weight:500;transition:.15s;
}
.pbtn:active,.pbtn:hover{border-color:var(--blue);background:var(--blue-bg);}
.pbtn.ghost{color:var(--txt2);border-color:var(--line);}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:11px;}
.thumbs:empty{margin-top:0;}
.thumb{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1/1;background:#fff;}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb .del{
  position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:50%;
  background:rgba(12,20,35,.6);color:#fff;font-size:15px;line-height:24px;text-align:center;
}
.thumb .no{position:absolute;left:5px;top:5px;background:rgba(12,20,35,.55);color:#fff;
  font-size:11px;padding:1px 7px;border-radius:20px;}

/* ============ 按钮 ============ */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:52px;border-radius:12px;font-size:16px;font-weight:600;transition:.15s;
}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 8px 18px -10px rgba(26,109,255,.95);}
.btn.primary:active{background:var(--blue-d);}
.btn.primary.o{background:var(--orange);box-shadow:0 8px 18px -10px rgba(224,123,22,.95);}
.btn.primary.g{background:var(--green);box-shadow:0 8px 18px -10px rgba(15,145,82,.95);}
.btn.plain{background:#fff;border:1px solid var(--line);color:var(--txt2);font-weight:500;font-size:15px;min-height:48px;}
.btn.plain:active{border-color:var(--blue);color:var(--blue);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.row2 .btn{min-height:48px;font-size:14.5px;}
.row2.fill{grid-template-columns:1fr 1.25fr;margin-top:0;}
.row2.fill .btn{min-height:50px;}
.row2.fill .btn.primary{font-size:16px;}
.actions{margin-top:16px;}

/* ============ 汇总 ============ */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px;position:relative;overflow:hidden;}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue);}
.stat.o::before{background:var(--orange);}
.stat.g::before{background:var(--green);}
.stat.p::before{background:var(--purple);}
.stat .k{font-size:12.5px;color:var(--txt3);}
.stat .v{font-size:23px;font-weight:700;letter-spacing:-.5px;line-height:1.25;}
.stat .v small{font-size:12px;font-weight:500;color:var(--txt3);margin-left:3px;}

.sec-title{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;margin:18px 2px 10px;}
.sec-title::before{content:'';width:8px;height:8px;border-radius:3px;background:var(--txt3);flex:none;}
.sec-title.office::before{background:var(--blue);}
.sec-title.site::before{background:var(--orange);}
.sec-title.accept::before{background:var(--green);}
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:13px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:340px;}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap;}
th{background:#f7f9fd;font-size:12px;color:var(--txt2);font-weight:600;}
tbody tr:last-child td{border-bottom:none;}
td.num,th.num{text-align:right;}
tr.total td{background:#f7f9fd;font-weight:600;}

.rec{background:#fff;border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden;}
.rec-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 13px;background:#fafcfe;border-bottom:1px solid var(--line2);}
.tag{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;flex:none;}
.tag.office{background:var(--blue-bg);color:var(--blue-d);}
.tag.site{background:var(--orange-bg);color:#9a5409;}
.tag.accept{background:var(--green-bg);color:var(--green);}
.rec-hd .nm{font-size:13.5px;font-weight:600;}
.rec-hd .tk{font-size:12.5px;color:var(--txt3);}
.rec-hd .del{margin-left:auto;font-size:12.5px;color:var(--red);padding:4px 8px;border-radius:8px;flex:none;}
.rec-hd .del:active{background:#fdecea;}
.rec-bd{padding:12px 13px;}
.kv{margin-bottom:12px;}
.kv:last-child{margin-bottom:0;}
.kv .k{color:var(--txt3);font-size:12.5px;margin-bottom:2px;}
.kv .v{font-size:14.5px;white-space:pre-wrap;word-break:break-word;}
.kv .v.photos{display:flex;flex-wrap:wrap;gap:7px;margin-top:3px;}
.kv .v.photos img{width:72px;height:72px;object-fit:cover;border-radius:9px;border:1px solid var(--line);}
.empty{background:#fff;border:1px solid var(--line);border-radius:13px;padding:44px 20px;text-align:center;color:var(--txt3);font-size:13.5px;}
.empty.small{padding:20px 14px;font-size:13px;}
.empty .ic{font-size:30px;opacity:.45;margin-bottom:8px;}

/* ============ 底部导航 ============ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:#fff;border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
  height:calc(var(--tabbar) + env(safe-area-inset-bottom));
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11.5px;color:var(--txt3);font-weight:500;transition:color .15s;
}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.tab.active{color:var(--blue);}
.tab[data-page=site].active{color:var(--orange);}
.tab[data-page=accept].active{color:var(--green);}
.tab[data-page=summary].active{color:var(--purple);}

/* ============ 提示 / 灯箱 ============ */
#toast{
  position:fixed;left:50%;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + 18px);
  transform:translate(-50%,26px);background:#16202f;color:#fff;
  padding:11px 20px;border-radius:11px;font-size:14px;max-width:86vw;text-align:center;
  box-shadow:0 12px 28px -10px rgba(0,0,0,.5);opacity:0;transition:.26s;z-index:90;pointer-events:none;
}
#toast.show{transform:translate(-50%,0);opacity:1;}
#lightbox{position:fixed;inset:0;background:rgba(10,17,29,.9);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
#lightbox.show{display:flex;}
#lightbox img{max-width:100%;max-height:82vh;border-radius:10px;}
#lightbox .close{position:absolute;top:calc(18px + env(safe-area-inset-top));right:20px;color:#fff;font-size:30px;line-height:1;opacity:.85;}

/* ============ 汇总：日期导航 ============ */
.print-head{display:none;}
.datebar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:12px;}
.db-nav{width:46px;height:46px;flex:none;border-radius:12px;background:#f1f5fb;color:var(--txt2);
  font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.15s;}
.db-nav:active{background:var(--blue-bg);color:var(--blue);}
.db-nav:disabled{opacity:.32;}
.db-all{width:auto;padding:0 12px;font-size:13px;font-weight:600;color:var(--txt2);}
.db-all.active{color:var(--blue);background:var(--blue-bg);}
.db-mid{flex:1;text-align:center;min-width:0;}
.db-mid input[type=date]{width:100%;border:none;background:transparent;text-align:center;
  font-size:17px;font-weight:600;color:var(--txt);padding:2px 0;font-family:inherit;}
.db-wk{font-size:12px;color:var(--txt3);margin-top:2px;}

/* ============ 汇总：子项目方框 ============ */
.pbox{background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);
  border-radius:14px;margin-bottom:12px;overflow:hidden;}
.pbox.t-office{border-left-color:var(--blue);}
.pbox.t-site{border-left-color:var(--orange);}
.pbox.t-accept{border-left-color:var(--green);}
.pbox-hd{display:flex;align-items:center;gap:8px;padding:12px 13px;background:#fafcfe;border-bottom:1px solid var(--line2);}
.pbox-hd .pn{font-size:15px;font-weight:600;flex:1;word-break:break-word;}
.pbox-hd .pc{font-size:12px;color:var(--txt3);flex:none;text-align:right;}
.pbox-bd{padding:2px 13px 12px;}
.pg-hd{display:flex;align-items:center;gap:7px;margin:11px 0 2px;}
.pg-hd .cnt{font-size:12px;color:var(--txt3);}
.ent{padding:11px 0;border-top:1px solid var(--line2);}
.pbox-bd .pg-hd:first-child + .ent,.pbox-bd > .ent:first-child{border-top:none;}
.ent-hd{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;}
.ent-hd .tk{flex:1;font-size:13.5px;font-weight:600;line-height:1.5;word-break:break-word;}
.ent-hd .del{flex:none;font-size:12px;color:var(--red);padding:3px 8px;border-radius:8px;}
.ent-hd .del:active{background:#fdecea;}

/* ============ 宽屏 ============ */
@media (min-width:820px){
  body{background:#eef1f6;}
  main{padding:20px 16px 8px;}
  .tabbar{width:760px;left:50%;transform:translateX(-50%);border-radius:14px 14px 0 0;border-left:1px solid var(--line);border-right:1px solid var(--line);}
  .stats{grid-template-columns:repeat(4,1fr);}
  .thumbs{grid-template-columns:repeat(5,1fr);}
  .row2{grid-template-columns:220px 220px;}
}
@media print{
  .appbar,.tabbar,.actions,.row2,.pbtns,.no-print,.tab,.datebar{display:none!important;}
  .print-head{display:block;font-size:17px;font-weight:700;margin:0 0 12px;}
  .del{display:none!important;}
  .stats{grid-template-columns:repeat(4,1fr);}
  body{background:#fff;padding:0;}
  .card,.rec,.tbl-wrap,.empty,.pbox,.stat{border-color:#ddd;box-shadow:none;break-inside:avoid;}
}
</style>
</head>
<body>

<header class="appbar">
  <div class="appbar-in">
    <div class="applogo">日</div>
    <div class="appbar-t">
      <div class="apptitle">转播技术组日志</div>
      <div class="appdate" id="todayText"></div>
    </div>
    <span class="chip" id="topChip">今日 0 条</span>
  </div>
</header>

<main>

  <!-- ============ 1 办公日志 ============ -->
  <section class="page active" id="page-office">
    <div class="page-head">
      <h2>办公日志</h2>
      <span class="sub">提交后自动记入当天</span>
      <span class="count" id="cnt-office">今日 0 条</span>
    </div>

    <div class="card">
      <div class="field">
        <label class="lb" for="office-project">子项目 <em>*</em></label>
        <select id="office-project"></select>
      </div>
      <div class="field">
        <label class="lb" for="office-content">今日工作内容 <em>*</em></label>
        <textarea id="office-content"></textarea>
      </div>
      <div class="field">
        <label class="lb" for="office-plan">明日工作计划</label>
        <textarea id="office-plan"></textarea>
      </div>
      <div class="field">
        <label class="lb" for="office-issue">存在问题和需协调事项</label>
        <textarea id="office-issue"></textarea>
      </div>
      <div class="field">
        <label class="lb">照片 <span class="opt">可多张</span></label>
        <div class="pbtns">
          <button class="pbtn" data-pick="office-cam">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2 2 0 0 1 5 6.5h1.6l1.2-2h8.4l1.2 2H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.4"/></svg>
            拍照
          </button>
          <button class="pbtn ghost" data-pick="office-alb">从相册选择</button>
        </div>
        <input type="file" id="office-cam" accept="image/*" capture="environment" hidden>
        <input type="file" id="office-alb" accept="image/*" multiple hidden>
        <div class="thumbs" id="office-thumbs"></div>
      </div>
    </div>

    <div class="actions">
      <div class="row2 fill">
        <button class="btn plain" data-reset="office">清空重填</button>
        <button class="btn primary" id="office-submit">提交</button>
      </div>
    </div>
  </section>

  <!-- ============ 2 施工日志 ============ -->
  <section class="page" id="page-site">
    <div class="page-head">
      <h2>施工日志</h2>
      <span class="sub">提交后自动记入当天</span>
      <span class="count" id="cnt-site">今日 0 条</span>
    </div>

    <div class="card">
      <div class="field">
        <label class="lb" for="site-project">子项目 <em>*</em></label>
        <select id="site-project"></select>
      </div>
      <div class="field">
        <label class="lb" for="site-content">施工内容 <em>*</em></label>
        <textarea id="site-content"></textarea>
      </div>
      <div class="field">
        <label class="lb" for="site-issue">存在问题及处理措施</label>
        <textarea id="site-issue"></textarea>
      </div>
      <div class="field">
        <label class="lb" for="site-coord">需协调事项</label>
        <textarea id="site-coord"></textarea>
      </div>
      <div class="field">
        <label class="lb">现场照片 <span class="opt">可多张</span></label>
        <div class="pbtns">
          <button class="pbtn" data-pick="site-cam">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2 2 0 0 1 5 6.5h1.6l1.2-2h8.4l1.2 2H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.4"/></svg>
            拍照
          </button>
          <button class="pbtn ghost" data-pick="site-alb">从相册选择</button>
        </div>
        <input type="file" id="site-cam" accept="image/*" capture="environment" hidden>
        <input type="file" id="site-alb" accept="image/*" multiple hidden>
        <div class="thumbs" id="site-thumbs"></div>
      </div>
    </div>

    <div class="actions">
      <div class="row2 fill">
        <button class="btn plain" data-reset="site">清空重填</button>
        <button class="btn primary o" id="site-submit">提交</button>
      </div>
    </div>
  </section>

  <!-- ============ 3 验收日志 ============ -->
  <section class="page" id="page-accept">
    <div class="page-head">
      <h2>验收日志</h2>
      <span class="sub">提交后自动记入当天</span>
      <span class="count" id="cnt-accept">今日 0 条</span>
    </div>

    <div class="card">
      <div class="field">
        <label class="lb" for="accept-project">子项目 <em>*</em></label>
        <select id="accept-project"></select>
      </div>
      <div class="field">
        <label class="lb" for="accept-content">验收内容 <em>*</em></label>
        <textarea id="accept-content"></textarea>
      </div>
      <div class="field">
        <label class="lb" for="accept-result">验收结论 <em>*</em></label>
        <select id="accept-result">
          <option value="">请选择</option>
          <option>合格</option>
          <option>整改后合格</option>
          <option>不合格</option>
        </select>
      </div>
      <div class="field">

var LOG_COS_CONFIG = {
  secretId: atob('QUtJRGhtYVE2YXJ1bERWVUl1TFlZUjZZZ2JKcEFJRzFhdzYz'),
  secretKey: atob('bVZBakFUeEtaaGhjUDVuT3JDUmFiVkl6WHhHVWFZUDg='),

};
var LOG_KEY = 'data/logbook/latest.json';
var logCosClient = null;
var LS_DELETED_KEY = LS_KEY + '_deleted';
function getLogCos(){
  if(!window.COS) return null;
  if(!logCosClient){
    logCosClient = new COS({ SecretId: LOG_COS_CONFIG.secretId, SecretKey: LOG_COS_CONFIG.secretKey });
  }
  return logCosClient;
}
function loadDeletedIds(){ try{ return JSON.parse(localStorage.getItem(LS_DELETED_KEY)) || []; }catch(e){ return []; } }
function saveDeletedIds(arr){ try{ localStorage.setItem(LS_DELETED_KEY, JSON.stringify(arr)); return true; }catch(e){ return false; } }
function uniqueIds(arr){
  var seen = {}, out = [];
  (arr || []).forEach(function(id){ if(id && !seen[id]){ seen[id] = 1; out.push(id); } });
  return out;
}
function cosBodyToString(body){
  if(typeof body === 'string') return body;
  if(body instanceof ArrayBuffer) return new TextDecoder('utf-8').decode(body);
  if(body && body.Buffer) return new TextDecoder('utf-8').decode(body.Buffer);
  if(body && typeof body.toString === 'function') return body.toString();
  return '';
}
function loadLogbookFromCOS(cb){
  var client = getLogCos();
  if(!client){ cb(null); return; }
  client.getObject({ Bucket: LOG_COS_CONFIG.bucket, Region: LOG_COS_CONFIG.region, Key: LOG_KEY }, function(err, data){
    if(err){ cb(null); return; }
    try{
      var parsed = JSON.parse(cosBodyToString(data.Body));
      var logs = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.logs) ? parsed.logs : []);
      var deletedIds = Array.isArray(parsed.deletedIds) ? parsed.deletedIds : [];
      cb({ logs: logs, deletedIds: deletedIds });
    }catch(e){ cb(null); }
  });
}
function saveLogbookToCOS(snapshot, done){
  var client = getLogCos();
  if(!client){ if(done) done(false); return; }
  var payload = { logs: snapshot.logs || [], deletedIds: snapshot.deletedIds || [], backupTime: new Date().toISOString() };
  var body = JSON.stringify(payload, null, 2);
  client.putObject({ Bucket: LOG_COS_CONFIG.bucket, Region: LOG_COS_CONFIG.region, Key: LOG_KEY, Body: body, ContentType: 'application/json; charset=utf-8' }, function(err){
    if(err){ if(done) done(false); return; }
    var now = new Date();
    var dateStr = now.toISOString().split('T')[0];
    var timeStr = now.toTimeString().split(' ')[0].replace(/:/g, '');
    client.putObject({
      Bucket: LOG_COS_CONFIG.bucket,
      Region: LOG_COS_CONFIG.region,
      Key: 'data/logbook/history/' + dateStr + '_' + timeStr + '.json',
      Body: body,
      ContentType: 'application/json; charset=utf-8'
    }, function(){ if(done) done(true); });
  });
}
function sortLogs(list){
  return (list || []).slice().sort(function(a, b){
    var ta = String(a.createdAt || ''), tb = String(b.createdAt || '');
    if(ta !== tb) return ta.localeCompare(tb);
    return String(a.id).localeCompare(String(b.id));
  });
}
function sameLogs(a, b){
  return JSON.stringify(sortLogs(a)) === JSON.stringify(sortLogs(b));
}
function sortIds(arr){ return (arr || []).slice().sort(); }
function sameIds(a, b){ return JSON.stringify(sortIds(a)) === JSON.stringify(sortIds(b)); }
function mergeById(a, b){
  var map = {};
  (a || []).concat(b || []).forEach(function(r){ if(r && r.id) map[r.id] = r; });
  return Object.keys(map).map(function(k){ return map[k]; });
}
function syncLogbook(removeId, done){
  var local = loadAll();
  var localDeleted = loadDeletedIds();
  loadLogbookFromCOS(function(snap){
    var cloud = snap ? snap.logs : [];
    var cloudDeleted = snap ? snap.deletedIds : [];
    var deleted = uniqueIds(localDeleted.concat(cloudDeleted).concat(removeId ? [removeId] : []));
    var merged = mergeById(local, cloud).filter(function(r){ return deleted.indexOf(r.id) === -1; });
    var localLogsChanged = !sameLogs(merged, local);
    var localDeletedChanged = !sameIds(deleted, localDeleted);
    var cloudLogsChanged = !sameLogs(merged, cloud);
    var cloudDeletedChanged = !sameIds(deleted, cloudDeleted);
    if(localLogsChanged) saveAll(merged);
    if(localDeletedChanged) saveDeletedIds(deleted);
    if(cloudLogsChanged || cloudDeletedChanged){
      saveLogbookToCOS({ logs: merged, deletedIds: deleted }, function(ok){
        refreshCounts(); renderSummary();
        if(done) done(ok);
      });
    } else {
      if(localLogsChanged || localDeletedChanged){ refreshCounts(); renderSummary(); }
      if(done) done(true);
    }
  });
}
function pad(n){ return String(n).padStart(2,'0'); }
function isoOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function today(){ return isoOf(new Date()); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

var tTimer;
function toast(msg){
  var el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(tTimer); tTimer=setTimeout(function(){ el.classList.remove('show'); }, 2600);
}

  office: { label:'办公日志', fields:[['content','今日工作内容'],['plan','明日工作计划'],['issue','存在问题和需协调事项']], photos:true, photoLabel:'照片' },
  site:   { label:'施工日志', fields:[['content','施工内容'],['issue','存在问题及处理措施'],['coord','需协调事项']], photos:true, photoLabel:'现场照片' },
  accept: { label:'验收日志', fields:[['content','验收内容'],['result','验收结论'],['issue','存在问题及处理措施'],['coord','需协调事项']], photos:true, photoLabel:'验收照片' }
};

/* ===== 照片 ===== */
function compress(file, maxW, q, cb){
  maxW = maxW || 1400; q = q || 0.72;
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      var ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg', q));
    };
    img.onerror = function(){ cb(null); };
    img.src = fr.result;
  };
  fr.onerror = function(){ cb(null); };
  fr.readAsDataURL(file);
}
function addFiles(type, files){
  var arr = Array.prototype.slice.call(files).filter(function(f){ return /^image\//.test(f.type); });
  if(!arr.length) return;
  var pending = arr.length;
  arr.forEach(function(f){
    compress(f, 1400, 0.72, function(url){
      if(url) PHOTOS[type].push({ name:f.name, data:url });
      if(--pending === 0){ renderThumbs(type); toast('已添加 '+arr.length+' 张照片'); }
    });
  });
}
function renderThumbs(type){
  var box = document.getElementById(type+'-thumbs');
  box.innerHTML = PHOTOS[type].map(function(p,i){
    return '<div class="thumb"><img src="'+p.data+'" alt=""><span class="no">'+(i+1)+'</span><span class="del" data-t="'+type+'" data-i="'+i+'">×</span></div>';
  }).join('');
}
function dataURLtoBlob(dataUrl){
  var parts = String(dataUrl).split(',');
  var mime = 'image/jpeg';
  var head = parts[0] || '';
  if(head.indexOf(':') > -1 && head.indexOf(';') > -1){ mime = head.slice(head.indexOf(':')+1, head.indexOf(';')); }
  var bstr = atob(parts[1]);
  var n = bstr.length;
  var u8 = new Uint8Array(n);
  for(var i=0;i<n;i++){ u8[i] = bstr.charCodeAt(i); }
  return new Blob([u8], { type: mime });
}
function uploadPhoto(pid, dataUrl, name, cb){
  var client = getLogCos();
  if(!client){ cb(new Error('cos-unavailable')); return; }
  var key = 'data/logbook/photos/' + pid + '.jpg';
  client.putObject({ Bucket: LOG_COS_CONFIG.bucket, Region: LOG_COS_CONFIG.region, Key: key, Body: dataURLtoBlob(dataUrl), ContentType: 'image/jpeg' }, function(err){
    if(err){ cb(err); return; }
    cb(null, { id: pid, key: key, name: name || '' });
  });
}
function deletePhoto(key){
  var client = getLogCos();
  if(!client || !key) return;
  client.deleteObject({ Bucket: LOG_COS_CONFIG.bucket, Region: LOG_COS_CONFIG.region, Key: key }, function(){});
}
function bodyToBlob(body){
  if(!body) return null;
  if(typeof Blob !== 'undefined' && body instanceof Blob) return body;
  if(body instanceof ArrayBuffer) return new Blob([body]);
  if(body.Buffer) return new Blob([body.Buffer]);
  if(typeof body === 'string') return new Blob([body], { type: 'image/jpeg' });
  return null;
}
function loadLogImages(root){
  var imgs = (root || document).querySelectorAll('img.log-photo[data-key]');
  Array.prototype.forEach.call(imgs, function(img){
    var key = img.getAttribute('data-key');
    var client = getLogCos();
    if(!client){ img.alt = '照片'; return; }
    client.getObject({ Bucket: LOG_COS_CONFIG.bucket, Region: LOG_COS_CONFIG.region, Key: key, DataType: 'arraybuffer' }, function(err, data){
      if(err || !data){ img.alt = '照片加载失败'; return; }
      var blob = bodyToBlob(data.Body);
      if(!blob){ img.alt = '照片加载失败'; return; }
      img.src = URL.createObjectURL(blob);
      img.onload = function(){ img.classList.add('loaded'); };
    });
  });
}
document.querySelectorAll('[data-pick]').forEach(function(btn){
  btn.addEventListener('click', function(){
    var id = btn.dataset.pick;
    document.getElementById(id).click();
  });
});
['office-cam','office-alb','site-cam','site-alb','accept-cam','accept-alb'].forEach(function(id){
  var type = id.split('-')[0];
  document.getElementById(id).addEventListener('change', function(){
    addFiles(type, this.files);
    this.value = '';
  });
});
document.addEventListener('click', function(e){
  var del = e.target.closest('.thumb .del');
  if(del){
    PHOTOS[del.dataset.t].splice(Number(del.dataset.i), 1);
    renderThumbs(del.dataset.t);
    return;
  }
  var img = e.target.closest('.thumb img, .kv .v.photos img');
  if(img){
    if(img.getAttribute('data-key') && !img.getAttribute('src')) return;
    openLightbox(img.src);
  }
});

/* ===== 提交 ===== */
function submitLog(type){
  var cfg = CFG[type];
  var project = document.getElementById(type+'-project').value;
  if(!project) return toast('请选择子项目');

  var data = {};
  for(var i=0;i<cfg.fields.length;i++){
    var key = cfg.fields[i][0], label = cfg.fields[i][1];
    var v = (document.getElementById(type+'-'+key).value || '').trim();
    var required = (key === 'content' || (type === 'accept' && key === 'result'));
    if(required && !v) return toast('请填写「'+label+'」');
    if(v) data[label] = v;
  }

  var photos = cfg.photos ? PHOTOS[type].slice() : [];
  if(!photos.length){ finalizeSubmit(type, cfg, project, data, []); return; }

  var remaining = photos.length;
  var failed = false;
  var refs = new Array(photos.length);
  photos.forEach(function(p, idx){
    var pid = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,9);
    uploadPhoto(pid, p.data, p.name, function(err, ref){
      if(err){ failed = true; }
      else { refs[idx] = ref; }
      if(--remaining === 0){
        var ordered = refs.filter(Boolean);
        if(failed){
          ordered.forEach(function(r){ deletePhoto(r.key); });
          toast('照片上传失败，请检查网络后重试');
        } else {
          finalizeSubmit(type, cfg, project, data, ordered);
        }
      }
    });
  });
}
function finalizeSubmit(type, cfg, project, data, photos){
  var list = loadAll();
  list.push({
    id: type.charAt(0) + Date.now() + Math.random().toString(36).slice(2,6),
    type: type,
    date: today(),
    project: project,
    task: '',
    data: data,
    photos: photos,
    createdAt: new Date().toISOString()
  });
  if(!saveAll(list)) return;
  var n = photos.length;
  resetForm(type, true);
  toast(cfg.label + '已提交' + (n ? '，含 ' + n + ' 张照片' : ''));
  refreshCounts();
  renderSummary();
  syncLogbook(null, function(ok){ if(!ok) toast('已提交到本机，云端同步失败'); });
}
['office','site','accept'].forEach(function(type){
  document.getElementById(type+'-submit').addEventListener('click', function(){ submitLog(type); });
});
function resetForm(type, keepProject){
  CFG[type].fields.forEach(function(f){
    var el = document.getElementById(type+'-'+f[0]);
    el.value = '';
  });
  if(CFG[type].photos){ PHOTOS[type] = []; renderThumbs(type); }
  if(!keepProject){
    document.getElementById(type+'-project').value = '';
  }
}
document.querySelectorAll('[data-reset]').forEach(function(btn){
  btn.addEventListener('click', function(){
    var t = btn.dataset.reset;
    resetForm(t, false);
    toast('已清空');
  });
});

/* ===== 导航 ===== */
function goto(page){
  document.querySelectorAll('.page').forEach(function(p){ p.classList.toggle('active', p.id === 'page-'+page); });
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.dataset.page === page); });
  if(page === 'summary') renderSummary();
  refreshCounts();
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){ goto(t.dataset.page); });
});
document.querySelectorAll('[data-goto]').forEach(function(b){
  b.addEventListener('click', function(){ goto(b.dataset.goto); });
});

/* ===== 计数 ===== */
function refreshCounts(){
  var all = loadAll(), d = today();
  var n = { office:0, site:0, accept:0 };
  all.forEach(function(r){ if(r.date === d && n[r.type] !== undefined) n[r.type]++; });
  var total = n.office + n.site + n.accept;
  document.getElementById('cnt-office').textContent = '今日 ' + n.office + ' 条';
  document.getElementById('cnt-site').textContent   = '今日 ' + n.site + ' 条';
  document.getElementById('cnt-accept').textContent = '今日 ' + n.accept + ' 条';
  document.getElementById('topChip').textContent    = '今日 ' + total + ' 条';
}

/* ===== 汇总 ===== */
var sumDate = document.getElementById('sum-date');
var sumWk   = document.getElementById('sum-wk');
var sumHead = document.getElementById('sum-printhead');
var sumPrev = document.getElementById('sum-prev');
var sumNext = document.getElementById('sum-next');
var sumAll = document.getElementById('sum-all');
var sumAllMode = false;
var WEEK_CN = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

function dateFromYmd(v){
  var a = String(v || '').split('-');
  return new Date(Number(a[0]), Number(a[1]) - 1, Number(a[2]));
}
function shiftYmd(v, n){
  var d = dateFromYmd(v);
  if(isNaN(d.getTime())) d = new Date();
  d.setDate(d.getDate() + n);
  return isoOf(d);
}
function weekOf(v){ return WEEK_CN[dateFromYmd(v).getDay()]; }
function projRank(p){ var i = PROJECTS.indexOf(p); return i < 0 ? 999 : i; }
function rankSort(a, b){ return projRank(a) - projRank(b); }
function byTime(a, b){ return String(a.createdAt || '').localeCompare(String(b.createdAt || '')); }
function hhmm(v){
  var d = new Date(v);
  if(isNaN(d.getTime())) return '';
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}

/* 汇总日期默认显示前一天 */
sumDate.value = shiftYmd(today(), -1);
sumDate.addEventListener('change', function(){ if(!sumAllMode) renderSummary(); });
sumPrev.addEventListener('click', function(){
  if(sumAllMode) return;
  sumDate.value = shiftYmd(sumDate.value || today(), -1);
  renderSummary();
});
sumNext.addEventListener('click', function(){
  if(sumAllMode || sumNext.disabled) return;
  sumDate.value = shiftYmd(sumDate.value || today(), 1);
  renderSummary();
});
sumAll.addEventListener('click', function(){
  sumAllMode = !sumAllMode;
  sumAll.classList.toggle('active', sumAllMode);
  renderSummary();
});

function photoLabel(t){ return (CFG[t] && CFG[t].photoLabel) || '照片'; }

function renderSummary(){
  var allMode = sumAllMode;
  var items;
  if(allMode){
    sumDate.disabled = true;
    sumPrev.disabled = true;
    sumNext.disabled = true;
    sumWk.textContent = '全部日志';
    sumHead.textContent = '转播技术组日志 · 全部日志';
    items = loadAll();
  } else {
    sumDate.disabled = false;
    sumPrev.disabled = false;
    var d = sumDate.value || shiftYmd(today(), -1);
    sumDate.value = d;
    var rel = d === today() ? ' · 今天' : (d === shiftYmd(today(), -1) ? ' · 前一天' : '');
    sumWk.textContent = d + ' ' + weekOf(d) + rel;
    sumNext.disabled = (d >= today());
    sumHead.textContent = '转播技术组日志 · 当日汇总　' + d + ' ' + weekOf(d);
    items = loadAll().filter(function(r){ return r.date === d; });
  }
  fillSection('sum-office', 'office', items, allMode);
  fillSection('sum-site',   'site',   items, allMode);
  fillSection('sum-accept', 'accept', items, allMode);
  loadLogImages();
}

/* 一个区块：按子项目拆分成方框 */
function fillSection(elId, type, items, allMode){
  var el = document.getElementById(elId);
  var list = items.filter(function(r){ return r.type === type; });
  if(!list.length){
    el.innerHTML = '<div class="empty small">' + (allMode ? '暂无记录' : (sumDate.value || '') + ' 暂无记录') + '</div>';
    return;
  }
  var g = {};
  list.forEach(function(r){ (g[r.project] = g[r.project] || []).push(r); });
  var html = '';
  Object.keys(g).sort(rankSort).forEach(function(p){
    html += projBox(p, type, g[p], allMode);
  });
  el.innerHTML = html;
}

function projBox(project, type, list, allMode){
  var h = '<div class="pbox t-' + type + '"><div class="pbox-hd"><span class="pn">' + esc(project) + '</span></div>' +
          '<div class="pbox-bd">';
  var sorted = list.slice();
  if(allMode){ sorted.sort(function(a,b){ return String(b.createdAt || '').localeCompare(String(a.createdAt || '')); }); }
  else { sorted.sort(byTime); }
  sorted.forEach(function(r){ h += entHtml(r, allMode); });
  return h + '</div></div>';
}

function entHtml(r, showDate){
  var head = (showDate ? esc(r.date) + ' ' : '') + esc(r.task || (hhmm(r.createdAt) + ' 提交'));
  var h = '<div class="ent"><div class="ent-hd"><div class="tk">' + head + '</div>' +
          '<button class="del no-print" data-del="' + r.id + '">删除</button></div>';
  Object.keys(r.data || {}).forEach(function(k){
    var v = r.data[k];
    if(v === '' || v == null) return;
    h += '<div class="kv"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div></div>';
  });
  if(r.photos && r.photos.length){
    h += '<div class="kv"><div class="k">' + esc(photoLabel(r.type)) + '</div><div class="v photos">' +
         r.photos.map(function(p,j){
           if(p.key) return '<img class="log-photo" data-key="' + esc(p.key) + '" alt="照片' + (j+1) + '">';
           if(p.data) return '<img src="' + p.data + '" alt="照片' + (j+1) + '">';
           return '';
         }).join('') +
         '</div></div>';
  }
  return h + '</div>';
}

['sum-office','sum-site','sum-accept'].forEach(function(id){
  document.getElementById(id).addEventListener('click', function(e){
    var del = e.target.closest('[data-del]');
    if(!del) return;
    if(!confirm('确认删除这条日志？')) return;
    var delId = del.dataset.del;
    var all = loadAll();
    var target = null;
    for(var i=0;i<all.length;i++){ if(all[i].id === delId){ target = all[i]; break; } }
    saveAll(all.filter(function(r){ return r.id !== delId; }));
    saveDeletedIds(uniqueIds(loadDeletedIds().concat([delId])));
    renderSummary(); refreshCounts(); toast('已删除');
    syncLogbook(delId, function(ok){
      if(ok){
        if(target && target.photos && target.photos.length){
          target.photos.forEach(function(p){ if(p && p.key) deletePhoto(p.key); });
        }
      } else {
        toast('已在本机删除，云端同步失败');
      }
    });
  });
});

(function(){
  var d = new Date();

    (d.getMonth()+1) + '月' + d.getDate() + '日 ' + w;
